[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dcactivity"
version = "1.1.0"
description = "Discord Rich Presence basado en la actividad real en la terminal de Linux"
readme = "README.md"
authors = [
    { name = "Mik0-T3ch" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.8"
keywords = ["discord", "rpc", "rich-presence", "terminal", "linux", "bash", "zsh", "fish"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities"
]
dependencies = [
    "pypresence>=4.3.0",
    "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
dcactivity = "dcactivity.cli.main:main"
dcactivity-daemon = "dcactivity.daemon.server:start_server"

[project.urls]
Homepage = "https://github.com/Mik0-T3ch/DcActivity-Shell"
Repository = "https://github.com/Mik0-T3ch/DcActivity-Shell.git"
Issues = "https://github.com/Mik0-T3ch/DcActivity-Shell/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["dcactivity*"]

[tool.setuptools.package-data]
dcactivity = [
    "config/*.json",
    "assets/*.png",
    "assets/*.jpeg",
    "collectors/*.sh",
    "collectors/*.zsh",
    "collectors/*.fish"
]
